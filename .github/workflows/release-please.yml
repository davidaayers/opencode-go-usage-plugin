name: Release Please

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v0.1.2
        required: true
        type: string
      version:
        description: Package version matching the tag, for example 0.1.2
        required: true
        type: string
      sha:
        description: Commit SHA pointed to by the release tag
        required: true
        type: string

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tag
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.release.outputs['.--tag_name'] || inputs.tag_name }}

      - name: Verify release contents
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ steps.release.outputs['.--sha'] || inputs.sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs['.--version'] || inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            printf 'Release tag does not point to the expected commit.\n' >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (packageJson.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Unexpected package version: ${packageJson.version}`);
            }
          '

      - name: Setup Node
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prepare pnpm
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: corepack enable

      - name: Install dependencies
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        if: ${{ steps.release.outputs['.--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          npm install --global npm@11.5.1
          pnpm check
          npm publish --provenance --access public

  finalize-merged-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release-please--branches--main' &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout merged release
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read release metadata
        id: metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$MERGE_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Verify release contents
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            printf 'Release checkout does not match the merged release commit.\n' >&2
            exit 1
          fi
          if [[ "$(node -p "require('./package.json').version")" != "$EXPECTED_VERSION" ]]; then
            printf 'Release package version does not match release metadata.\n' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prepare pnpm
        run: corepack enable

      - name: Publish to npm
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            printf '%s@%s is already published; skipping.\n' "$PACKAGE" "$VERSION"
          else
            pnpm install --frozen-lockfile
            pnpm check
            npm publish --provenance --access public
          fi

      - name: Mark release PR tagged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --remove-label 'autorelease: pending' \
            --add-label 'autorelease: tagged'
